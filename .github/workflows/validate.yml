name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # プリセットはデフォルトブランチから全 PJ に即座に読まれるため、
      # 壊れた設定を main に入れないことがこのリポジトリの最重要事項。
      - name: Validate presets
        run: npx --yes --package renovate@latest -- renovate-config-validator --strict *.json .github/renovate.json
